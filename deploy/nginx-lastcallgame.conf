# /etc/nginx/sites-available/lastcallgame.fun
server {
    listen 80;
    listen [::]:80;
    server_name lastcallgame.fun www.lastcallgame.fun;

    root /var/www/lastcallgame.fun;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
# HTTPS: sudo certbot --nginx -d lastcallgame.fun -d www.lastcallgame.fun
