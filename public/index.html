<style id="css">
/* Layout: operation briefing file. Sticky command bar, one view at a time, red used only for actions and the final phase. */
/* Palette: navy #0B1730 and signal red #A60002. Dark is the default; the header toggle (html.t-light / html.t-dark) overrides the viewer theme. */
:root{
  --bg:#EEF0F4; --surface:#F7F8FA; --raise:#FFFFFF; --ink:#0B1730; --muted:#4E5A70; --line:#CDD3DE;
  --accent:#A60002; --accent-fg:#A60002; --accent-ink:#FFFFFF; --accent-soft:#F6DCDC;
  --ok:#2E6B4A; --ok-soft:#D8EADF; --warn:#A60002; --crit:#A60002; --crit-soft:#F6DCDC;
  --case-bg:#0B1730; --case-fg:#EEF0F4; --media-bg:#0B1730;
  --shadow:0 1px 0 rgba(11,23,48,.06),0 8px 24px -12px rgba(11,23,48,.3); color-scheme:light;
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --wrap:1180px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#04080F; --surface:#0A1327; --raise:#0F1B36; --ink:#E6EAF2; --muted:#8E9AB2; --line:#18264A;
  --accent:#A60002; --accent-fg:#FF6B64; --accent-ink:#FFFFFF; --accent-soft:#2E0E17;
  --ok:#6FC49A; --ok-soft:#0F2D28; --warn:#FF6B64; --crit:#FF6B64; --crit-soft:#2E0E17;
  --case-bg:#0B1730; --case-fg:#E6EAF2; --media-bg:#0B1730;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.8); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#04080F; --surface:#0A1327; --raise:#0F1B36; --ink:#E6EAF2; --muted:#8E9AB2; --line:#18264A;
  --accent:#A60002; --accent-fg:#FF6B64; --accent-ink:#FFFFFF; --accent-soft:#2E0E17;
  --ok:#6FC49A; --ok-soft:#0F2D28; --warn:#FF6B64; --crit:#FF6B64; --crit-soft:#2E0E17;
  --case-bg:#0B1730; --case-fg:#E6EAF2; --media-bg:#0B1730;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.8); color-scheme:dark }
:root.t-dark{
  --bg:#04080F; --surface:#0A1327; --raise:#0F1B36; --ink:#E6EAF2; --muted:#8E9AB2; --line:#18264A;
  --accent:#A60002; --accent-fg:#FF6B64; --accent-ink:#FFFFFF; --accent-soft:#2E0E17;
  --ok:#6FC49A; --ok-soft:#0F2D28; --warn:#FF6B64; --crit:#FF6B64; --crit-soft:#2E0E17;
  --case-bg:#0B1730; --case-fg:#E6EAF2; --media-bg:#0B1730;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.8); color-scheme:dark }
:root.t-light{
  --bg:#EEF0F4; --surface:#F7F8FA; --raise:#FFFFFF; --ink:#0B1730; --muted:#4E5A70; --line:#CDD3DE;
  --accent:#A60002; --accent-fg:#A60002; --accent-ink:#FFFFFF; --accent-soft:#F6DCDC;
  --ok:#2E6B4A; --ok-soft:#D8EADF; --warn:#A60002; --crit:#A60002; --crit-soft:#F6DCDC;
  --case-bg:#0B1730; --case-fg:#EEF0F4; --media-bg:#0B1730;
  --shadow:0 1px 0 rgba(11,23,48,.06),0 8px 24px -12px rgba(11,23,48,.3); color-scheme:light }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
strong{font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px;border-radius:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:20px}
@media (max-width:520px){.wrap{padding-inline:16px}}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* command bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;padding:8px 12px;border-radius:var(--r);font-size:14px;font-weight:500;color:var(--muted)}
.nav a:hover{color:var(--ink);background:var(--surface)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent-fg)}
.langs{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.langs button{border:0;background:transparent;padding:5px 9px;font-family:var(--f-mono);font-size:12px;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:760px){.bar-in{gap:8px}.nav{order:3;flex-basis:100%;margin-inline:-6px}.langs{margin-left:auto}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raise);padding:9px 16px;border-radius:var(--r);font-weight:500;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--crit)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

main{padding-block:0 80px;min-height:60vh}
.view-head{padding-block:48px 28px;display:grid;gap:10px}
.view-head h1{font-size:clamp(34px,5vw,54px);text-transform:uppercase}
.view-head p{max-width:62ch;color:var(--muted);font-size:17px}

/* hero */
.hero{padding-block:56px 40px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:end}
.hero h1{font-size:clamp(64px,11vw,150px);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:.88}
.hero h1 em{font-style:normal;color:var(--accent-fg)}
.hero .lead{font-size:clamp(17px,1.6vw,20px);max-width:52ch;margin-top:22px}
.hero .goal{margin-top:18px;padding:14px 16px;border-left:3px solid var(--accent-fg);background:var(--surface);max-width:56ch;font-weight:500}
.hero .row{margin-top:26px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:16px 14px;border-right:1px solid var(--line);min-width:0}
.facts div:last-child{border-right:0}
.facts b{display:block;font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1}
.facts span{font-size:13px;color:var(--muted)}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:28px;padding-block:36px 28px}}
@media (max-width:560px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.facts div:nth-child(2){border-right:0}.facts div:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* case card (next match) */
.casecard{background:var(--case-bg);color:var(--case-fg);border-radius:10px;padding:22px;display:grid;gap:14px;position:relative;overflow:hidden}
.casecard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--case-fg) 5%,transparent) 14px 15px);pointer-events:none}
.casecard>*{position:relative}
.casecard .eyebrow{color:color-mix(in srgb,var(--case-fg) 65%,var(--case-bg))}
.casecard h3{font-size:30px;text-transform:uppercase}
.casecard .meta{font-family:var(--f-mono);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;color:color-mix(in srgb,var(--case-fg) 80%,var(--case-bg))}
.casecard .code{font-family:var(--f-mono);font-size:12px;letter-spacing:.3em;color:#FF6B64}
.casecard .btn{border-color:transparent}
.casecard .btn.ghost{color:var(--case-fg);border-color:color-mix(in srgb,var(--case-fg) 35%,transparent)}

/* phase track */
.track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin-block:8px 8px;counter-reset:ph}
.ph{position:relative;padding:16px 14px 18px;border-top:3px solid var(--line);min-width:0}
.ph::before{counter-increment:ph;content:counter(ph,decimal-leading-zero);font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.ph h4{font-size:19px;text-transform:uppercase}
.ph p{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.45}
.ph.final{border-top-color:var(--accent-fg)}
.ph.final h4{color:var(--accent-fg)}
.ph .tag{display:inline-block;margin-top:8px;font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:3px;background:var(--accent-soft);color:var(--ink)}
@media (max-width:980px){.track{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.track{grid-template-columns:1fr}.ph{border-top:0;border-left:3px solid var(--line);padding:10px 0 14px 16px}.ph.final{border-left-color:var(--accent-fg)}}

/* guide */
.guide{display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:2px;font-size:14px}
.toc a{text-decoration:none;color:var(--muted);padding:5px 10px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--ink);border-left-color:var(--ink)}
@media (max-width:900px){.guide{grid-template-columns:1fr}.toc{display:none}}
.chap{padding-block:34px;border-top:1px solid var(--line);display:grid;gap:16px;scroll-margin-top:90px}
.chap h2{font-size:clamp(26px,3.2vw,36px);text-transform:uppercase}
.prose{display:grid;gap:12px;max-width:68ch}
.prose ul{margin:0;padding-left:20px;display:grid;gap:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:8px;align-content:start;min-width:0}
.card h3{font-size:19px;text-transform:uppercase}
.card p{font-size:15px}
.callout{padding:12px 14px;background:var(--crit-soft);border-radius:var(--r);font-weight:500;max-width:68ch}
.diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.diff div{background:var(--surface);padding:16px;display:grid;gap:4px;align-content:start}
.diff b{font-weight:600}
.diff span{font-size:14px;color:var(--muted)}
.final-note{font-family:var(--f-display);font-size:clamp(22px,2.8vw,30px);text-transform:uppercase;max-width:30ch;line-height:1.15}
.final-note em{font-style:normal;color:var(--accent-fg)}

/* score calc */
.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:720px}
.calc label{display:flex;gap:10px;align-items:center;font-weight:500}
.calc input[type=range]{width:100%;accent-color:var(--accent)}
.calc .out{text-align:right}
.calc .out b{font-family:var(--f-display);font-size:64px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.calc .formula{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.calc .ctl{display:grid;gap:14px;min-width:0}
@media (max-width:520px){.calc{grid-template-columns:1fr}.calc .out{text-align:left}}

/* news */
.feed{display:grid;gap:0;max-width:820px}
.post{display:grid;grid-template-columns:140px minmax(0,1fr);gap:24px;padding-block:26px;border-top:1px solid var(--line)}
.post .when{display:grid;gap:6px;align-content:start}
.post .when time{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.post h3{font-size:24px;text-transform:uppercase}
.post .body{display:grid;gap:10px;margin-top:10px}
.post .body ul{margin:0;padding-left:20px;display:grid;gap:4px}
@media (max-width:620px){.post{grid-template-columns:1fr;gap:8px}.post .when{grid-auto-flow:column;justify-content:start;align-items:center;gap:10px}}
.ver{font-family:var(--f-mono);font-size:13px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;width:max-content}
.pill.update{background:var(--accent-soft);border-color:transparent}
.pill.patch{background:var(--surface)}
.pill.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.live{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.pill.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.pill.ex{border-style:dashed;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* roadmap */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.lane{display:grid;gap:10px}
.lane-h{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:2px solid var(--line)}
.lane-h h2{font-size:20px;text-transform:uppercase}
.lane.progress .lane-h{border-bottom-color:var(--accent-fg)}
.lane.done .lane-h{border-bottom-color:var(--ok)}
.lane .count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.rm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px}
.rm h3{font-size:18px;text-transform:uppercase}
.rm p{font-size:15px;color:var(--muted)}
.rm .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.rm .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (max-width:860px){.lanes{grid-template-columns:1fr}}
.empty{padding:22px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:15px}

/* season */
.seasons{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.seasons button{border:1px solid var(--line);background:transparent;padding:8px 14px;border-radius:var(--r);cursor:pointer;font-weight:500;display:flex;gap:8px;align-items:center}
.seasons button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.s-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:940px){.s-grid{grid-template-columns:1fr}}
.s-grid h2{font-size:24px;text-transform:uppercase;margin-bottom:12px}
.s-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:28px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.match{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.match:last-child{border-bottom:1px solid var(--line)}
.match .d{text-align:center;display:grid;line-height:1.05}
.match .d b{font-family:var(--f-display);font-size:30px;font-weight:600}
.match .d span{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.match h3{font-size:18px;text-transform:uppercase}
.match .info{font-size:14px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.match .info .mono{color:var(--ink)}
.match .act{display:grid;justify-items:end;gap:6px}
@media (max-width:560px){.match{grid-template-columns:58px minmax(0,1fr)}.match .act{grid-column:1/-1;justify-items:start;grid-auto-flow:column;justify-content:start;align-items:center}}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.lead1 td{font-weight:600}
td .place{font-family:var(--f-display);font-size:18px;display:inline-block;min-width:1.5em}
tr.lead1 .place{color:var(--accent-fg)}
.rule{font-size:13px;color:var(--muted);margin-top:10px;font-family:var(--f-mono)}

/* bugs */
.bug{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.bug{grid-template-columns:1fr}}
form.f{display:grid;gap:14px}
.fld{display:grid;gap:5px;min-width:0}
.fld label{font-size:13px;font-weight:600}
.fld .hint{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise)}
.fld textarea{min-height:92px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent-fg);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.sev{display:flex;gap:6px;flex-wrap:wrap}
.sev label{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:500}
.sev input{accent-color:var(--accent);width:auto}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:12px}
.discord{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-family:var(--f-mono);font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:460px;overflow:auto}
.steps{display:grid;gap:6px;font-size:14px;color:var(--muted);counter-reset:s;padding:0;margin:0;list-style:none}

function t(k){ return (UI[lang] && UI[lang][k]) || UI.ru[k] || k; }
function tr(o){ if (o == null) return ''; if (typeof o === 'string') return o; return o[lang] || o.ru || o.en || o.uk || ''; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }
function md(s){
  s = String(s || '').replace(/\r/g,'').trim(); if (!s) return '';
  var out = [], para = [], list = [];
  function fp(){ if (para.length){ out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } }
  function fl(){ if (list.length){ out.push('<ul>' + list.map(function(x){ return '<li>' + inline(x) + '</li>'; }).join('') + '</ul>'); list = []; } }
  s.split('\n').forEach(function(l){
    var h = l.match(/^\s*#{2,3}\s+(.*)$/), li = l.match(/^\s*[-*]\s+(.*)$/);
    if (!l.trim()) { fp(); fl(); }
    else if (h) { fp(); fl(); out.push('<h3>' + inline(h[1]) + '</h3>'); }
    else if (li) { fp(); list.push(li[1]); }
    else { fl(); para.push(l); }
  });
  fp(); fl(); return out.join('');
}

function todayISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function safeUrl(u){ u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : (u && /^[\w.-]+\.[a-z]{2,}/i.test(u) ? 'https://' + u : ''); }
function host(u){ try { return new URL(safeUrl(u)).host; } catch(e){ return u; } }

  b:{ru:'В операции одновременно могут участвовать до **9 независимых отрядов**, каждый численностью до **9 человек**. Каждый отряд представляет отдельную **фракцию — одну из участвующих в операции наций**.\n\nФракции отличаются формой и экипировкой. Внешний вид бойца — одна из основных систем распознавания «свой — чужой». Прежде чем открыть огонь, убедитесь, что правильно определили форму цели.\n\nИгроки других отрядов — ваши противники, даже если технически Squad относит всех участников к одной стороне.',
     uk:'В операції одночасно можуть брати участь до **9 незалежних загонів**, кожен чисельністю до **9 осіб**. Кожен загін представляє окрему **фракцію — одну з націй, що беруть участь в операції**.\n\nФракції відрізняються формою та спорядженням. Зовнішній вигляд бійця — одна з основних систем розпізнавання «свій — чужий». Перш ніж відкрити вогонь, переконайтеся, що правильно визначили форму цілі.\n\nГравці інших загонів — ваші супротивники, навіть якщо технічно Squad відносить усіх учасників до однієї сторони.',

 {id:'comms', t:{ru:'Связь',uk:'Зв’язок',en:'Comms'},
  b:{ru:'**Командирский канал полностью удалён.** У отрядов нет общего канала, через который лидеры могли бы координироваться.\n\nВнутри отряда работает **отрядная радиосвязь**. Кроме неё есть **локальный голосовой канал**, общий для всех игроков рядом, независимо от отряда и фракции.\n\nЕсли вы намеренно говорите в **Local VOIP**, вас может услышать противник поблизости — и наоборот. Локальный канал можно использовать для переговоров с противником, а можно выдать им своё присутствие.',

 {id:'match', t:{ru:'Как проходит матч',uk:'Як проходить матч',en:'How a match plays out'},
  b:{ru:'Операция состоит из **трёх основных этапов и финальной эвакуации**. Первые три этапа дают отрядам преимущества для главной задачи.\n\nНа карте появляются военные системы, доступные для взлома: нужно добраться до цели, захватить позицию и завершить взлом. Другие отряды могут идти к той же цели, поэтому почти любая попытка получить преимущество превращается в бой.\n\nУспешный взлом даёт **код награды**, который используется через тактический планшет. Одни награды работают сразу, другие окажутся ценными гораздо позже.',
     uk:'Операція складається з **трьох основних етапів і фінальної евакуації**. Перші три етапи дають загонам переваги для головного завдання.\n\nНа карті з’являються військові системи, доступні для злому: треба дістатися цілі, захопити позицію й завершити злам. Інші загони можуть іти до тієї ж цілі, тож майже будь-яка спроба отримати перевагу перетворюється на бій.\n\nУспішний злам дає **код нагороди**, який використовується через тактичний планшет. Одні нагороди діють одразу, інші стануть цінними значно пізніше.',

 {id:'recon', t:{ru:'Разведка и тактические камеры',uk:'Розвідка й тактичні камери',en:'Recon and tactical cameras'},
  b:{ru:'Некоторые награды открывают средства разведки. Их главная особенность — **совместное использование**: погибшие бойцы, ожидающие возвращения, могут наблюдать за обстановкой и передавать информацию живым.',
     uk:'Деякі нагороди відкривають засоби розвідки. Їхня головна особливість — **спільне використання**: загиблі бійці, що чекають повернення, можуть стежити за обстановкою й передавати інформацію живим.',
     en:'Some rewards unlock recon tools. Their key feature is **sharing**: dead squadmates waiting to return can watch the area and pass information to the living.'},
  cards:[
   {t:{ru:'Tactical UAV',uk:'Tactical UAV',en:'Tactical UAV'}, b:{ru:'БПЛА для разведки района операции с воздуха.',uk:'БПЛА для розвідки району операції з повітря.',en:'A drone for aerial recon of the area of operations.'}},
   {t:{ru:'Tactical Quadcopter',uk:'Tactical Quadcopter',en:'Tactical Quadcopter'}, b:{ru:'Небольшой квадрокоптер для локальной разведки нужного района.',uk:'Невеликий квадрокоптер для локальної розвідки потрібного району.',en:'A small quadcopter for close recon of a specific spot.'}},
   {t:{ru:'Тактические камеры',uk:'Тактичні камери',en:'Tactical cameras'}, b:{ru:'Камера на шлеме или bodycam на экипировке. Члены отряда подключаются к каналу и смотрят глазами товарищей. Потеря источника — «Нет сигнала».',uk:'Камера на шоломі або bodycam на спорядженні. Члени загону підключаються до каналу й дивляться очима товаришів. Втрата джерела — «Немає сигналу».',en:'A helmet camera or a bodycam on the vest. Squadmates tune in and watch through a teammate’s eyes. If the source is lost, the feed shows No Signal.'}}
  ]
 },
 {id:'ammo', t:{ru:'Боеприпасы — это ресурс',uk:'Набої — це ресурс',en:'Ammo is a resource'},
  b:{ru:'Бесконечно пополнять боекомплект на стартовой базе нельзя. Нужно искать **точки снабжения** — их расположение меняется от матча к матчу, они различаются размером и запасом.\n\nНа точке можно **пополнить личный боекомплект** или **загрузить боеприпасы в транспорт**. Запас ограничен и восстанавливается небольшими порциями, поэтому точки особенно ценны для экипажей техники.\n\nТочку можно уничтожить **зарядом C4** — и лишить снабжения всех остальных.',
     uk:'Безкінечно поповнювати боєкомплект на стартовій базі не можна. Треба шукати **точки постачання** — їхнє розташування змінюється від матчу до матчу, вони відрізняються розміром і запасом.\n\nНа точці можна **поповнити особистий боєкомплект** або **завантажити набої в транспорт**. Запас обмежений і відновлюється невеликими порціями, тож точки особливо цінні для екіпажів техніки.\n\nТочку можна знищити **зарядом C4** — і позбавити постачання всіх інших.',
     en:'You cannot restock endlessly at the main base. You have to find **supply points**; they move from match to match and differ in size and stock.\n\nAt a point you can **refill your own kit** or **load ammo into a vehicle**. Stock is limited and refills in small portions, which makes these points especially valuable to vehicle crews.\n\nA **C4 charge** destroys a point and cuts everyone else off from it.'}
 },
 {id:'vehicles', t:{ru:'Техника',uk:'Техніка',en:'Vehicles'},
  b:{ru:'Техника не принадлежит отряду безусловно: брошенную машину может захватить противник. Но просто сесть за руль недостаточно — чужую технику нужно **взломать**.\n\nЧем ценнее машина, тем дольше взлом: лёгкий транспорт захватить проще, чем серьёзную боевую технику.',
     uk:'Техніка не належить загону беззастережно: покинуту машину може захопити супротивник. Але просто сісти за кермо недостатньо — чужу техніку треба **зламати**.\n\nЩо цінніша машина, то довше триває злам: легкий транспорт захопити простіше, ніж серйозну бойову техніку.',
     en:'Vehicles are not permanently tied to a squad: an abandoned vehicle can be taken by the enemy. Getting in the driver’s seat is not enough, though; you have to **hack** it.\n\nThe more valuable the vehicle, the longer the hack. A light truck is far easier to take than serious armour.'}
 },
 {id:'case', t:{ru:'Кейс, Case Tracker и разведданные',uk:'Кейс, Case Tracker і розвіддані',en:'The case, Case Tracker and intel'},
  b:{ru:'Первые этапы — подготовка. Главная борьба начинается с появлением **кейса с кодами доступа к стратегическому арсеналу**. Кейс физически находится в игровом мире: его нужно найти, забрать и удержать. Носителя могут убить. **Кейс можно потерять и перехватить** — лидер начала матча не обязательно останется владельцем до конца.',
     uk:'Перші етапи — підготовка. Головна боротьба починається з появою **кейса з кодами доступу до стратегічного арсеналу**. Кейс фізично знаходиться в ігровому світі: його треба знайти, забрати й утримати. Носія можуть убити. **Кейс можна втратити й перехопити** — лідер початку матчу не обов’язково залишиться власником до кінця.',
     en:'The early stages are preparation. The real fight starts when the **case with the strategic arsenal access codes** appears. The case exists physically in the world: find it, take it, hold it. The carrier can be killed. **The case can be lost and intercepted**; whoever leads early will not necessarily hold it at the end.'},
  cards:[
   {t:{ru:'Case Tracker',uk:'Case Tracker',en:'Case Tracker'}, b:{ru:'Появляется на третьем этапе. Код используется через планшет неограниченно: показывает примерное направление и расстояние до кейса, обновляется с интервалом и небольшой погрешностью. Где цель — вы знаете. Кто рядом с ней — нет.',uk:'З’являється на третьому етапі. Код використовується через планшет необмежено: показує приблизний напрямок і відстань до кейса, оновлюється з інтервалом і невеликою похибкою. Де ціль — ви знаєте. Хто поруч із нею — ні.',en:'Unlocks in stage three. The code can be used on the tablet any number of times and shows the rough direction and distance to the case, updating at intervals with a small error. You know roughly where the target is. You do not know who is near it.'}},
   {t:{ru:'Разведданные',uk:'Розвіддані',en:'Intel'}, b:{ru:'Со второго этапа всем известна точка военной разведки. Подключитесь к сети через планшет и удерживайте позицию до конца загрузки. Награда — два возможных района финальной эвакуации. Это публичная цель: там будут другие отряды.',uk:'З другого етапу всім відома точка військової розвідки. Підключіться до мережі через планшет і утримуйте позицію до кінця завантаження. Нагорода — два можливі райони фінальної евакуації. Це публічна ціль: там будуть інші загони.',en:'From stage two everyone knows where the military intel point is. Connect through the tablet and hold until the download finishes. The reward is two possible final extraction areas. It is a public objective, so expect other squads.'}}
  ]
 },
 {id:'evac', t:{ru:'Эвакуация и Last Call',uk:'Евакуація і Last Call',en:'Extraction and Last Call'},
  b:{ru:'Кейс нужно **вывезти из района операции**. Доставьте его в зону эвакуации, подайте сигнал, удержите район, дождитесь транспорта и улетайте вместе с кейсом. Здесь должны окупиться все преимущества предыдущих этапов.',
     uk:'Кейс треба **вивезти з району операції**. Доставте його в зону евакуації, подайте сигнал, утримайте район, дочекайтеся транспорту й відлітайте разом із кейсом. Тут мають окупитися всі переваги попередніх етапів.',
     en:'The case has to **leave the area of operations**. Bring it to the extraction zone, signal, hold the area, wait for the transport and leave with the case. This is where everything you gained earlier has to pay off.'},
  cards:[
   {t:{ru:'Если эвакуация сорвана',uk:'Якщо евакуацію зірвано',en:'If extraction fails'}, b:{ru:'Потеря первого транспорта — ещё не поражение. Доберитесь до резервного района, снова подайте сигнал и повторите попытку. Если сорвана и вторая — воздушная эвакуация невозможна.',uk:'Втрата першого транспорту — ще не поразка. Дістаньтеся резервного району, знову подайте сигнал і повторіть спробу. Якщо зірвано й другу — повітряна евакуація неможлива.',en:'Losing the first transport is not defeat. Reach the backup area, signal again and retry. If the second attempt also fails, air extraction is off the table.'}},
   {t:{ru:'Last Call',uk:'Last Call',en:'Last Call'}, b:{ru:'Последний шанс — наземная точка передачи кейса. После активации её положение видят все участники. Владельцам кейса нужно дойти и передать его. Остальным — остановить их.',uk:'Останній шанс — наземна точка передачі кейса. Після активації її розташування бачать усі учасники. Власникам кейса треба дійти й передати його. Іншим — зупинити їх.',en:'The last chance is a ground hand-off point. Once it activates, everyone sees where it is. The case holders must reach it and hand the case over. Everyone else must stop them.'}}
  ]
 },
 {id:'score', t:{ru:'Очки',uk:'Очки',en:'Scoring'},
  b:{ru:'Результат зависит не только от доставки кейса, но и от того, сколько бойцов удалось вывести.\n\n**Эвакуация кейса — 4 очка. Каждый эвакуированный игрок — ещё 1 очко.** Игрок с кейсом приносит 4 + 1. Вырваться одному с кейсом и вывести весь отряд — большая разница.',
     uk:'Результат залежить не лише від доставки кейса, а й від того, скільки бійців вдалося вивести.\n\n**Евакуація кейса — 4 очки. Кожен евакуйований гравець — ще 1 очко.** Гравець із кейсом приносить 4 + 1. Вирватися самому з кейсом і вивести весь загін — велика різниця.',
     en:'The result depends on getting the case out and on how many of your players get out with it.\n\n**Extracting the case is 4 points. Each extracted player is 1 more.** The carrier alone brings 4 + 1. Escaping alone with the case and getting the whole squad out are very different results.'},
  calc:true
 },
 {id:'diff', t:{ru:'Что нужно знать игроку Squad',uk:'Що треба знати гравцю Squad',en:'What Squad players need to know'},
  b:{ru:'Некоторые привычные правила Squad здесь работают иначе.',uk:'Деякі звичні правила Squad тут працюють інакше.',en:'Some familiar Squad rules work differently here.'},
  diff:[
   {t:{ru:'Нет двух команд',uk:'Немає двох команд',en:'No two teams'}, d:{ru:'До девяти отрядов разных наций воюют друг с другом.',uk:'До дев’яти загонів різних націй воюють один з одним.',en:'Up to nine squads of different nations fight each other.'}},
   {t:{ru:'Форма — это распознавание',uk:'Форма — це розпізнавання',en:'Uniforms are your IFF'}, d:{ru:'Учитесь определять противника до выстрела.',uk:'Вчіться визначати супротивника до пострілу.',en:'Learn to identify targets before you shoot.'}},
   {t:{ru:'Friendly Fire включён',uk:'Friendly Fire увімкнено',en:'Friendly fire is on'}, d:{ru:'Каждый выстрел имеет значение.',uk:'Кожен постріл має значення.',en:'Every shot counts.'}},
   {t:{ru:'Нет командирского канала',uk:'Немає командирського каналу',en:'No commander channel'}, d:{ru:'Общей радиосвязи между отрядами нет.',uk:'Спільного радіозв’язку між загонами немає.',en:'There is no shared radio between squads.'}},
   {t:{ru:'Local VOIP слышат все рядом',uk:'Local VOIP чують усі поруч',en:'Everyone nearby hears Local VOIP'}, d:{ru:'Включая противника.',uk:'Зокрема супротивник.',en:'Including the enemy.'}},
   {t:{ru:'Нет ограничений ролей',uk:'Немає обмежень ролей',en:'No role limits'}, d:{ru:'Хоть девять медиков, хоть девять снайперов.',uk:'Хоч дев’ять медиків, хоч дев’ять снайперів.',en:'Nine medics or nine snipers, your call.'}},
   {t:{ru:'Нет тандемных ПТ-боеприпасов',uk:'Немає тандемних ПТ-боєприпасів',en:'No tandem AT rounds'}, d:{ru:'Удалены у всех фракций.',uk:'Видалені в усіх фракцій.',en:'Removed for every faction.'}},
   {t:{ru:'Боеприпасы ограничены',uk:'Набої обмежені',en:'Ammo is limited'}, d:{ru:'Контроль точек снабжения реально ценен.',uk:'Контроль точок постачання справді цінний.',en:'Holding supply points really matters.'}},
   {t:{ru:'Технику можно захватить',uk:'Техніку можна захопити',en:'Vehicles can be stolen'}, d:{ru:'Чужую машину сначала нужно взломать.',uk:'Чужу машину спершу треба зламати.',en:'An enemy vehicle has to be hacked first.'}},
   {t:{ru:'Информация ограничена',uk:'Інформація обмежена',en:'Information is limited'}, d:{ru:'Одна сторона в Squad не даёт полной картины.',uk:'Одна сторона в Squad не дає повної картини.',en:'Being on the same Squad side does not show you the full picture.'}},
   {t:{ru:'Смерть — не конец участия',uk:'Смерть — не кінець участі',en:'Death is not the end'}, d:{ru:'Помогайте отряду через камеры и разведку.',uk:'Допомагайте загону через камери й розвідку.',en:'Help your squad through cameras and recon.'}}
  ],
  final:{ru:'Первые три этапа — не цель матча. Всё решится, <em>когда начнётся борьба за кейс.</em>',uk:'Перші три етапи — не мета матчу. Усе вирішиться, <em>коли почнеться боротьба за кейс.</em>',en:'The first three stages are not the point of the match. It is decided <em>when the fight for the case begins.</em>'}
 }
];

/* ---------- state helpers ---------- */
var VIEWS = ['mode','news','roadmap','season','bugs'];
var view = 'mode', postId = null, galleryIdx = 0;
function parseHash(){ var h = location.hash.slice(1); if (/^news-[\w.~-]+$/.test(h)) { view = 'post'; postId = h.slice(5); } else { view = VIEWS.indexOf(h) >= 0 ? h : 'mode'; postId = null; } }
parseHash();
var theme = lsGet('lc-theme'); if (theme !== 'light' && theme !== 'dark') theme = 'dark';
function applyTheme(){ var r = document.documentElement; r.classList.toggle('t-dark', theme === 'dark'); r.classList.toggle('t-light', theme === 'light'); }
applyTheme();
var tzIdx = 0, tzStart = Date.now();
var ed = { can:false, on:false, dirty:false, busy:false, user:null };
var selSeason = null;
var bug = { title:'', ver:'', map:'', stage:'any', sev:'major', steps:'', expected:'', actual:'', nick:'', media:'' };
var calc = { case:true, n:5 };

function sortedNews(){ return (S.news||[]).slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }); }
function seasonsSorted(){ var o={active:0,upcoming:1,finished:2}; return (S.seasons||[]).slice().sort(function(a,b){ return (o[a.status]-o[b.status]) || (b.start||'').localeCompare(a.start||''); }); }
function matchesOf(id){ return (S.matches||[]).filter(function(m){ return m.season===id; }).sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); }); }
function nextMatch(){ var td=todayISO(); return (S.matches||[]).filter(function(m){ return m.status!=='done' && (m.date||'')>=td; }).sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); })[0]; }
function seasonById(id){ return (S.seasons||[]).filter(function(s){ return s.id===id; })[0]; }
function exPill(o){ return o && o.example ? '<span class="pill ex">'+esc(t('example'))+'</span>' : ''; }
function kindPill(k){ var cls = k==='update'?'update':k==='patch'?'patch':''; return '<span class="pill '+cls+'">'+esc(t('k_'+(k||'news')))+'</span>'; }
function regUrl(m){ return safeUrl((m && m.registerUrl) || S.config.registerUrl); }
function edTools(kind,id){ if(!ed.on) return ''; return '<span class="edtools"><button class="btn sm" data-ed="'+kind+'" data-id="'+esc(id)+'">'+esc(t('edit'))+'</button><button class="btn sm danger" data-del="'+kind+'" data-id="'+esc(id)+'">'+esc(t('del'))+'</button></span>'; }
function addBtn(kind){ return ed.on ? '<div class="addbar"><button class="btn sm primary" data-ed="'+kind+'" data-id="">+ '+esc(t('add'))+'</button></div>' : ''; }

/* ---------- render ---------- */
var root = document.getElementById('root');
function render(){
  document.documentElement.lang = lang === 'uk' ? 'uk' : lang;
  var html = header() + '<main><div class="wrap view-in">' + ({mode:vMode,news:vNews,post:vPost,roadmap:vRoadmap,season:vSeason,bugs:vBugs}[view])() + '</div></main>' + footer() + edBar();
  root.innerHTML = html;
  if (view === 'bugs') updateBugPreview();
}
function header(){
  var nav = VIEWS.map(function(v){ return '<a href="#'+v+'"'+(v===view||(view==='post'&&v==='news')?' aria-current="page"':'')+'>'+esc(t('nav_'+v))+'</a>'; }).join('');
  var langs = LANGS.map(function(l){ return '<button type="button" data-lang="'+l+'" aria-pressed="'+(l===lang)+'">'+LANG_LABEL[l]+'</button>'; }).join('');
  return '<header class="bar"><div class="wrap bar-in"><a class="brand" href="#mode"><b>Last Call</b><span>'+esc(t('tagline'))+'</span></a><nav class="nav" aria-label="Sections">'+nav+'</nav><div class="tools"><button type="button" class="themebtn" data-act="theme" aria-label="'+esc(theme==='dark'?t('theme_light'):t('theme_dark'))+'" title="'+esc(theme==='dark'?t('theme_light'):t('theme_dark'))+'">'+(theme==='dark'?SUN:MOON)+'</button><div class="langs" role="group" aria-label="Language">'+langs+'</div></div></div></header>';
}
function footer(){
  var d = safeUrl(S.config.discordUrl);
  return '<footer><div class="wrap"><span>'+esc(t('foot'))+'</span><span class="row">'+(d?'<a href="'+esc(d)+'" target="_blank" rel="noopener">Discord</a>':'')+'<a href="'+esc(safeUrl(S.config.registerUrl))+'" target="_blank" rel="noopener">'+esc(host(S.config.registerUrl))+'</a>'+(ed.can ? (!ed.on ? '<button class="btn sm ghost" data-act="ed-on">'+esc(t('editor'))+'</button>' : '') : (ed.user ? '<span class="muted">'+esc(t('no_admin'))+'</span><button class="btn sm ghost" data-act="logout">'+esc(t('logout'))+'</button>' : (sb ? '<button class="btn sm ghost" data-act="login">'+esc(t('login'))+'</button>' : '')))+'</span></div></footer>';
}
function edBar(){
  if (!ed.on) return '';
  return '<div class="edbar"><div class="wrap"><span class="msg">'+esc(ed.dirty ? t('ed_dirty') : t('ed_on'))+'</span><button class="btn sm" data-ed="config" data-id="config">'+esc(t('settings'))+'</button>'+(ed.dirty?'<button class="btn sm" data-act="discard">'+esc(t('discard'))+'</button><button class="btn sm primary" data-act="publish"'+(ed.busy?' disabled':'')+'>'+esc(t('publish'))+'</button>':'<button class="btn sm" data-act="ed-off">'+esc(t('exit'))+'</button><button class="btn sm" data-act="logout">'+esc(t('logout'))+'</button>')+'</div></div>';
}

function matchCard(m){
  if (!m) return '<div class="casecard"><span class="eyebrow">'+esc(t('next'))+'</span><h3>'+esc(t('no_next'))+'</h3><div class="row"><a class="btn ghost" href="#season">'+esc(t('schedule'))+'</a></div></div>';
  var s = seasonById(m.season);
  var open = m.status === 'open' && regUrl(m);
  return '<div class="casecard"><span class="eyebrow">'+esc(t('next'))+(s?' · '+esc(tr(s.name)):'')+'</span>'+
    '<h3>'+esc(fmtDate(m.date,{day:'numeric',month:'long',weekday:'short'}))+'</h3>'+
    '<div class="meta"><span>'+esc(m.time||'')+' '+esc(S.config.tz||'')+'</span><span>'+esc(m.map||t('map_tba'))+'</span><span>'+esc(t('slots'))+'</span></div>'+
    '<span class="code">CASE-'+esc((m.date||'').replace(/-/g,'').slice(2))+'-'+esc((m.map||'XXXX').slice(0,4).toUpperCase())+'</span>'+
    '<div class="row">'+(open?'<a class="btn primary" href="'+esc(regUrl(m))+'" target="_blank" rel="noopener">'+esc(t('register'))+' ↗</a>':'<span class="pill">'+esc(t('reg_closed'))+'</span>')+'<a class="btn ghost" href="#season">'+esc(t('schedule'))+'</a></div></div>';
}
function vMode(){
  var facts = FACTS.map(function(f){ return '<div><b>'+esc(tr(f.n))+'</b><span>'+esc(t(f.k))+'</span></div>'; }).join('');

    var txt = bugText();
    var fallback = function(){ var o=document.getElementById('bug-out'); var r=document.createRange(); r.selectNodeContents(o); var s=getSelection(); s.removeAllRanges(); s.addRange(r); toast(t('copy_fail')); };
    try { navigator.clipboard.writeText(txt).then(function(){ toast(t('copied')); }, fallback); } catch(e){ fallback(); }
  }
});
document.addEventListener('input', function(ev){
  var el = ev.target;
  if (el.hasAttribute && el.hasAttribute('data-bug')) { bug[el.getAttribute('data-bug')] = el.value; updateBugPreview(); return; }
  if (el.id==='calc-n' || el.id==='calc-case') {
    calc.n = Number(document.getElementById('calc-n').value); calc.case = document.getElementById('calc-case').checked;
    document.getElementById('calc-nv').textContent = calc.n;
    document.getElementById('calc-out').textContent = (calc.case?4:0)+calc.n;
    document.getElementById('calc-f').textContent = (calc.case?'4 + ':'')+calc.n+' × 1';
  }
});
document.addEventListener('change', function(ev){ var el=ev.target;
  if (el.hasAttribute && el.hasAttribute('data-upl') && editing) {
    var k = el.getAttribute('data-upl'), single = el.getAttribute('data-single') === 'true';
    toast(t('uploading'));
    Promise.all(Array.prototype.map.call(el.files, function(f){ return compress(f).then(function(b){ return uploadMedia(b, 'jpg'); }).catch(function(){ toast(t('upl_fail')); return null; }); })).then(function(list){
      list = list.filter(Boolean); if (!list.length || !editing) return;
      editing.item[k] = single ? list[list.length-1] : getImgs(k).concat(list);
      refreshImgs(k); el.value = '';
    });
    return;
  }
  if (el.hasAttribute && el.hasAttribute('data-vupl') && editing) {
    var f = el.files && el.files[0], target = document.getElementById(el.getAttribute('data-vupl'));
    if (!f) return;
    if (f.size > 50*1024*1024) { toast(t('vid_big')); el.value = ''; return; }
    toast(t('uploading'));
    uploadMedia(f, (f.name.split('.').pop() || 'mp4').toLowerCase()).then(function(url){ if (target) target.value = url; toast(t('published').replace(/.*/, '✓')); }).catch(function(){ toast(t('upl_fail')); });
    el.value = '';
    return;
  } if (el.id==='calc-case') el.dispatchEvent(new Event('input',{bubbles:true})); if (el.getAttribute && el.getAttribute('data-bug')==='sev') { bug.sev = el.value; updateBugPreview(); } });
document.addEventListener('keydown', function(ev){ if (ev.key==='Escape' && editing) closeEditor(); });
window.addEventListener('hashchange', function(){ var pv = view, pp = postId; parseHash(); if (view !== pv || postId !== pp) { galleryIdx = 0; render(); window.scrollTo(0,0); } });

render();

/* data and admin access */
loadRemote();
if (sb) { checkAdmin(); sb.auth.onAuthStateChange(function(ev){ if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') checkAdmin(); }); }
})();
</script>
